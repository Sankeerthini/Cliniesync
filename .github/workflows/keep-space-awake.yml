# Free Hugging Face Spaces sleep after 48 h without visitors; a visit every 6 h keeps the demo link warm.
# Set the repository variable SPACE_URL (Settings -> Secrets and variables -> Actions -> Variables),
# e.g. https://cliniesync-cliniesync.hf.space - without it this job does nothing.
name: Keep demo awake

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.SPACE_URL != '' }}
    steps:
      - name: Visit the demo
        run: curl -fsS -m 120 -o /dev/null -w "%{http_code} in %{time_total}s\n" "${{ vars.SPACE_URL }}/api/auth/demo-users"
